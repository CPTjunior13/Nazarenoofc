name: Gerar APK

on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Montar a pasta do app
        run: |
          mkdir -p www/icons assets
          cp index.html manifest.json sw.js config.js www/
          cp icon-192.png icon-512.png icon-maskable-512.png www/icons/
          cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/

      - name: Instalar dependências
        run: npm install

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Ajustes do Android (login Google e tela cheia)
        run: python3 patch-android.py

      - name: Gerar ícones e tela de abertura
        run: npx --yes @capacitor/assets@3.0.5 generate --android

      - name: Sincronizar os arquivos
        run: npx cap sync android

      - name: Usar a chave fixa (para as atualizações instalarem por cima)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: nazareno-oficial-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
